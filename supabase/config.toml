[functions.ticketline-prices]
verify_jwt = true

[auth.email]
otp_length = 6
otp_expiry = 300

# CLI development settings. Hosted projects apply these same files in Auth > Emails.
[auth.email.template.magic_link]
subject = "Your Ticketline sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Welcome to Ticketline — confirm your email"
content_path = "./supabase/templates/confirmation.html"
