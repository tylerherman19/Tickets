name: ticket details
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Public catalog event ID to capture (history only)
        type: string
        required: true
concurrency:
  group: ticketline-targeted-details
  cancel-in-progress: false
jobs:
  backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-health.yml
  capture:
    permissions:
      contents: read
      id-token: write
    needs: backend
    if: needs.backend.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the deployed database version
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_release_gate.py
      - run: python -m pip install playwright==1.60.0
      - name: Save event prices and seats without notifications
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
          TIX_DETAIL_EVENT_ID: ${{ inputs.event_id }}
        run: python scripts/ticket_details.py
