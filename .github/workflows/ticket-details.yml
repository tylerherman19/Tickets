name: ticket details
on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Public catalog event ID to capture (history only)
        type: string
        required: true
concurrency:
  group: ticketline-targeted-details
  cancel-in-progress: false
jobs:
  capture:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.60.0
      - name: Save event prices and seats without notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TIX_DETAIL_EVENT_ID: ${{ inputs.event_id }}
        run: python scripts/ticket_details.py
