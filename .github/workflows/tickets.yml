name: tickets

on:
  workflow_dispatch:
    inputs:
      test_sms:
        description: "Send one test to the legacy fallback destination"
        type: boolean
        default: false
  schedule:
    # Sole automatic trigger. GitHub can delay scheduled starts; the collector
    # decides which watched events are due on each run.
    - cron: "*/15 * * * *"

concurrency:
  group: tickets-collector
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check watched events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          TIX_TEST_SMS: ${{ inputs.test_sms }}
        run: python scripts/tickets_collect.py
