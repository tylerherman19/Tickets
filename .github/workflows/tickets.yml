name: tickets

on:
  workflow_dispatch:
    inputs:
      test_sms:
        description: "Send one test to the legacy fallback destination"
        type: boolean
        default: false
      watchdog:
        description: "Run the health watchdog; collect only if the last check is stale"
        type: boolean
        default: false
  # The existing cron-job.org job sends tickets-ping every 15 minutes.
  # It is the sole automatic scheduler. There is no GitHub cron or pacer.
  repository_dispatch:
    types: [tickets-ping, tickets-watchdog]

concurrency:
  group: tickets-collector
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check watched events or recover stale collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          TIX_TEST_SMS: ${{ inputs.test_sms }}
          TIX_WATCHDOG: ${{ github.event.action == 'tickets-watchdog' || inputs.watchdog == true }}
        run: |
          if [ "$TIX_WATCHDOG" = "true" ]; then
            python scripts/tickets_watchdog.py
          else
            python scripts/tickets_collect.py
          fi
