name: tickets

on:
  workflow_dispatch:
    inputs:
      test_sms:
        description: "Send one test to the legacy fallback destination"
        type: boolean
        default: false
      watchdog:
        description: "Run the health watchdog; collect only if the last check is stale"
        type: boolean
        default: false
      force_watched:
        description: "Check all active watched events now, regardless of cadence"
        type: boolean
        default: false
  # The existing external dispatcher sends tickets-ping every 15 minutes.
  # This GitHub schedule is a backup health check, never an unconditional scan.
  schedule:
    - cron: '8,23,38,53 * * * *'
  repository_dispatch:
    types: [tickets-ping, tickets-watchdog]

concurrency:
  group: tickets-collector
  cancel-in-progress: false

jobs:
  check:
    # Free-plan storage outage: automatic database jobs are paused.
    # Manual recovery remains available; restore automatic runs only after
    # PostgreSQL is healthy, approved retention finishes, and disk has headroom.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser driver for watched listing checks
        run: |
          python -m pip install playwright==1.60.0
          command -v google-chrome
      - name: Preserve existing collection until the guarded schema is deployed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tickets_release_gate.py
      - name: Expire private search activity after 90 days
        continue-on-error: true # Retention outages must not stop ticket checks.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tickets_search_retention.py
      - name: check watched events or recover stale collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMS_GATEWAY: ${{ secrets.SMS_GATEWAY }}
          TIX_TEST_SMS: ${{ inputs.test_sms }}
          TIX_WATCHDOG: ${{ github.event_name == 'schedule' || github.event.action == 'tickets-watchdog' || inputs.watchdog == true }}
          TIX_FORCE_WATCHED: ${{ inputs.force_watched }}
        run: |
          if [ "$TIX_WATCHDOG" = "true" ]; then
            python scripts/tickets_watchdog.py
          else
            python scripts/tickets_collect.py
          fi
