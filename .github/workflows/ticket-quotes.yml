name: warm ticket quotes
on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [tickets-ping, tickets-watchdog]
  workflow_dispatch:
concurrency:
  group: ticketline-quote-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the deployed database version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tickets_release_gate.py
      - run: python -m pip install playwright==1.60.0
      - name: Keep requested and recently viewed seat prices warm
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tickets_quote_worker.py
