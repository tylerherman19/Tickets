name: warm ticket quotes
on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [tickets-ping, tickets-watchdog]
  workflow_dispatch:
concurrency:
  group: ticketline-quote-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  warm:
    permissions:
      contents: read
      id-token: write
    # Free-plan storage outage: automatic database jobs are paused.
    # Manual recovery remains available; restore automatic runs only after
    # PostgreSQL is healthy, approved retention finishes, and disk has headroom.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the deployed database version
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_release_gate.py
      - run: python -m pip install playwright==1.60.0
      - name: Keep requested and recently viewed seat prices warm
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_quote_worker.py
