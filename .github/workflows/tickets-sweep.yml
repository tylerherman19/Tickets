name: ticket price sweep
on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: '1-8 comma-separated public catalog event IDs (prices only; no alerts)'
        type: string
        required: false
      bootstrap:
        description: 'Complete initial college basketball coverage across all linked teams'
        type: boolean
        default: false
      college_team:
        description: 'Optional linked college team code for targeted import, e.g. cbbsyr'
        type: string
        required: false
      catalog_category:
        description: 'Optional catalog import before pricing'
        type: choice
        options: ['', college-basketball]
        default: ''
concurrency:
  group: ticketline-background-sweep
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sweep:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select the collector compatible with the deployed schema
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_release_gate.py
      - name: Import requested college basketball catalog
        if: inputs.catalog_category == 'college-basketball'
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
          TIX_BASKETBALL_BOOTSTRAP: ${{ inputs.bootstrap }}
          TIX_BASKETBALL_TEAM: ${{ inputs.college_team }}
        run: python scripts/tickets_basketball_catalog.py
      - name: Save prices for the requested events
        if: inputs.event_ids != ''
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
          TIX_SWEEP_EVENT_IDS: ${{ inputs.event_ids }}
        run: python scripts/tickets_sweep.py
