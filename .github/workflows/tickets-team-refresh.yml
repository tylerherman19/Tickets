name: searched team schedules and coverage
on:
  push:
    branches: [main]
    paths: [scripts/tickets_coverage_health.py]
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [tickets-ping, tickets-watchdog]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Refresh the provider identity directory for all supported sports'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tickets-team-demand
  cancel-in-progress: false
jobs:
  backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-health.yml
  refresh:
    permissions:
      contents: read
      id-token: write
    needs: backend
    if: needs.backend.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select the collector compatible with the deployed schema
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_release_gate.py
      - name: Refresh requested teams within the existing provider budget
        env:
          TIX_TEAM_REGISTRY_BOOTSTRAP: ${{ inputs.bootstrap }}
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_team_refresh.py
      - name: Check aggregate coverage and flag actionable outages
        if: always()
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_coverage_health.py

