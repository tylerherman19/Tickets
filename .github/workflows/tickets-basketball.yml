name: college basketball catalog
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Complete the initial catalog across every provider-listed college team'
        type: boolean
        default: false
concurrency:
  group: tickets-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-health.yml
  import:
    permissions:
      contents: read
      id-token: write
    needs: backend
    if: needs.backend.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select deployed collector
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_release_gate.py
      - name: Pull college basketball schedules from Gametime
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
          TIX_BASKETBALL_BOOTSTRAP: ${{ inputs.bootstrap }}
        run: python scripts/tickets_basketball_catalog.py
