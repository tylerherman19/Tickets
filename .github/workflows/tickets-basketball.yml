name: college basketball catalog
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
concurrency:
  group: tickets-collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select deployed collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tickets_release_gate.py
      - name: Pull college basketball schedules from Gametime
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tickets_basketball_catalog.py
