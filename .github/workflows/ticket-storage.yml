name: retain Ticketline listing history
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ticketline-listing-retention
  cancel-in-progress: false
jobs:
  backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/backend-health.yml
    with:
      maintenance: true
  retain:
    permissions:
      contents: read
      id-token: write
    needs: backend
    if: needs.backend.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove only day-old individual listing copies after preserving history
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_storage.py
