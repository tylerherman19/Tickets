name: retain Ticketline listing history
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ticketline-listing-retention
  cancel-in-progress: false
jobs:
  retain:
    # Free-plan storage outage: automatic database jobs are paused.
    # Manual recovery remains available; restore automatic runs only after
    # PostgreSQL is healthy, approved retention finishes, and disk has headroom.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove only day-old individual listing copies after preserving history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/tickets_storage.py
