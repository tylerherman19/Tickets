name: retain Ticketline listing history
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ticketline-listing-retention
  cancel-in-progress: false
jobs:
  retain:
    permissions:
      contents: read
      id-token: write
    # Free-plan storage outage: automatic database jobs are paused.
    # Manual recovery remains available; restore automatic runs only after
    # PostgreSQL is healthy, approved retention finishes, and disk has headroom.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove only day-old individual listing copies after preserving history
        env:
          SUPABASE_URL: https://br-round-pine-b5ahrts5-ticketline.compute.c-7.us-east-2.aws.neon.tech
          SUPABASE_SERVICE_KEY: github-oidc
        run: python scripts/tickets_storage.py
